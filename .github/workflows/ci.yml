name: CI

# Workflow chain:
#   ci.yml (this file) — entry point for push/PR events
#     ├── build.yml   — compile firmware, upload artifact, create GitHub Release on tags
#     └── deploy.yml  — download artifact, push to gh-pages (on push to main/tags only)
#           └── pages-build-deployment (GitHub built-in) — serves the web installer
#
# deploy.yml can also be triggered manually to redeploy without rebuilding.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ziermmar/esphome-epaper-dashboard/.github/workflows/build.yml@main
    with:
      files: dashboard-epaper.yaml
      release-version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      create-release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit
    permissions:
      contents: write

  deploy:
    needs: build
    if: github.event_name == 'push'
    uses: ziermmar/esphome-epaper-dashboard/.github/workflows/deploy.yml@main
    with:
      run-id: ${{ github.run_id }}
    permissions:
      contents: write
      actions: read
