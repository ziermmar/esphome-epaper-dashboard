name: CI

# Workflow chain:
#   ci.yml (this file) — entry point for push/PR events
#     └── build.yml   — reusable: compile firmware, deploy to gh-pages, create GitHub Release on tags
#           └── gh-pages branch push
#                 └── pages-build-deployment (GitHub built-in) — serves the web installer
#
# deploy.yml — manual shortcut to redeploy the web installer without rebuilding

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read
  security-events: read
  id-token: none

jobs:
  build:
    uses: ziermmar/esphome-epaper-dashboard/.github/workflows/build.yml@main
    with:
      files: dashboard-epaper.yaml
      release-version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      publish-pages: ${{ github.event_name == 'push' }}
      create-release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit
